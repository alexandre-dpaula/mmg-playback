<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{TITLE}}</title>
  <!--[if mso]>
  <style type="text/css">
    body, table, td {font-family: Arial, Helvetica, sans-serif !important;}
  </style>
  <![endif]-->
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }

    /* Base */
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    /* Container */
    .email-container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Colors */
    .bg-black { background-color: #000000; }
    .bg-dark { background-color: #121212; }
    .bg-card { background-color: #181818; }
    .bg-green { background-color: #1DB954; }
    .text-white { color: #ffffff; }
    .text-gray { color: #b3b3b3; }
    .text-green { color: #1DB954; }

    /* Spacing */
    .p-0 { padding: 0; }
    .p-20 { padding: 20px; }
    .p-40 { padding: 40px; }
    .pt-40 { padding-top: 40px; }
    .pb-40 { padding-bottom: 40px; }
    .mb-20 { margin-bottom: 20px; }
    .mb-30 { margin-bottom: 30px; }

    /* Typography */
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }

    /* Button */
    .btn {
      display: inline-block;
      padding: 16px 32px;
      background-color: #1DB954;
      color: #000000 !important;
      text-decoration: none;
      border-radius: 500px;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: #1ed760;
      transform: scale(1.02);
    }

    /* Card */
    .card {
      background-color: #181818;
      border-radius: 16px;
      padding: 24px;
      margin: 20px 0;
    }

    /* Responsive */
    @media only screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
      }
      .p-40 { padding: 20px !important; }
      .btn { display: block !important; width: 100% !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #000000;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #000000;">
    <tr>
      <td style="padding: 40px 20px;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px; margin: 0 auto;">

          <!-- HEADER / LOGO -->
          <tr>
            <td style="text-align: center; padding-bottom: 40px;">
              <h1 style="margin: 0; color: #ffffff; font-size: 32px; font-weight: 700; letter-spacing: -0.5px;">
                <span style="color: #1DB954;">Setlist</span>GO™
              </h1>
              <p style="margin: 8px 0 0 0; color: #b3b3b3; font-size: 12px; text-transform: uppercase; letter-spacing: 2px;">
                Ensaio Vocal
              </p>
            </td>
          </tr>

          <!-- CONTENT AREA -->
          <tr>
            <td style="background-color: #121212; border-radius: 16px; padding: 40px;">

              {{CONTENT}}

            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="padding-top: 40px; text-align: center;">
              <p style="margin: 0 0 12px 0; color: #666666; font-size: 14px;">
                SetlistGO™ - Plataforma de Ensaio Vocal
              </p>
              <p style="margin: 0 0 12px 0; color: #666666; font-size: 12px;">
                © 2025 SetlistGO™. Todos os direitos reservados.
              </p>
              <p style="margin: 0; font-size: 12px;">
                <a href="#" style="color: #1DB954; text-decoration: none; margin: 0 8px;">Ajuda</a>
                <span style="color: #333333;">|</span>
                <a href="#" style="color: #1DB954; text-decoration: none; margin: 0 8px;">Política de Privacidade</a>
                <span style="color: #333333;">|</span>
                <a href="#" style="color: #1DB954; text-decoration: none; margin: 0 8px;">Termos de Uso</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
